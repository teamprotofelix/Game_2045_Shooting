name: Verify game
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check game.js
      - run: node --test tests/game.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: |
          python3 -m http.server 8765 > /tmp/chrono-server.log 2>&1 &
          node tests/browser.cjs
      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-browser-captures
          path: /tmp/chrono-*.png
          if-no-files-found: ignore
